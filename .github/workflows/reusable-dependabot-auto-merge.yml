name: Reusable Dependabot Triage

# Dependabot helper. As of 2026-06-01 this NO LONGER auto-merges or self-applies
# `ai-approved` — every PR, including the bot's, gets human eyes before merge
# (decision: stay on GitHub Free, social-contract enforcement, not server-side
# blocking). It now only COMMENTS on the bot's PRs so they don't sit silently:
# minor/patch get a "review + merge if green" note, major bumps a "needs
# migration work" note. No merge, no label application.
#
# Called by consumer repos via:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   jobs:
#     auto-merge:
#       if: github.actor == 'dependabot[bot]'
#       uses: Simple-Schedules/.github/.github/workflows/reusable-dependabot-auto-merge.yml@main

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  triage:
    name: Dependabot triage (comment only — no auto-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot PR metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on minor/patch (human review required — no auto-merge)
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "🤖 Dependabot minor/patch (${{ steps.meta.outputs.dependency-names }} → ${{ steps.meta.outputs.new-version }}). **Not auto-merged** — every PR gets human eyes. Review, apply \`ai-approved\`, and merge if checks are green."

      - name: Comment on major version bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "🚦 Major version bump (${{ steps.meta.outputs.dependency-names }} → ${{ steps.meta.outputs.new-version }}) — major versions often require migration work. Review manually and merge if safe, or close if not yet."
